    <!-- NEW FONT: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'media',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'], // Updated Font
            },
            colors: {
              surface: {
                50: '#fafafa',
                100: '#f5f5f5',
                200: '#e5e5e5',
                800: '#262626',
                900: '#171717',
                950: '#0a0a0a',
              },
              content: {
                primary: 'var(--content-primary)',
                secondary: 'var(--content-secondary)',
                inverted: 'var(--content-inverted)',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --content-primary: #171717;
        --content-secondary: #737373;
        --content-inverted: #ffffff;
      }
      
      @media (prefers-color-scheme: dark) {
        :root {
          --content-primary: #f5f5f5;
          --content-secondary: #a3a3a3;
          --content-inverted: #000000;
        }
      }

      body {
        background-color: #fafafa;
        color: #171717;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0a0a0a;
          color: #f5f5f5;
        }
      }
    </style>
